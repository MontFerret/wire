syntax = "proto3";

package ferret.wire.v1;

import "ferret/wire/v1/plan.proto";
import "ferret/wire/v1/runtime.proto";
import "ferret/wire/v1/source.proto";
import "ferret/wire/v1/value.proto";

option go_package = "github.com/MontFerret/wire/gen/ferret/wire/v1;wirev1";

// DebugService exposes connection-owned debugger sessions without changing
// the DebugSession -> DebugController -> Unified API debugger ownership chain.
service DebugService {
  // CreateDebugSession creates a CREATED resource from a reusable debug Plan.
  rpc CreateDebugSession(CreateDebugSessionRequest) returns (CreateDebugSessionResponse);
  // Start begins execution once; later resumes use Continue or a step command.
  rpc Start(StartRequest) returns (StartResponse);
  // SetBreakpoint is valid only while the session is CREATED or STOPPED.
  rpc SetBreakpoint(SetBreakpointRequest) returns (SetBreakpointResponse);
  rpc DeleteBreakpoint(DeleteBreakpointRequest) returns (DeleteBreakpointResponse);
  // Continue publishes RUNNING before invoking the hosted debugger.
  rpc Continue(ContinueRequest) returns (ContinueResponse);
  // Pause requests a stop without owning or releasing the session.
  rpc Pause(PauseRequest) returns (PauseResponse);
  // StepOver resumes until the next statement without entering a called function.
  rpc StepOver(StepOverRequest) returns (StepOverResponse);
  // StepIn resumes until the next statement, entering a called function when applicable.
  rpc StepIn(StepInRequest) returns (StepInResponse);
  // StepOut resumes until execution leaves the current frame.
  rpc StepOut(StepOutRequest) returns (StepOutResponse);
  // Inspection RPCs require the current STOPPED state.
  rpc Frames(FramesRequest) returns (FramesResponse);
  rpc FrameLocals(FrameLocalsRequest) returns (FrameLocalsResponse);
  rpc Variables(VariablesRequest) returns (VariablesResponse);
  rpc EvaluateFrame(EvaluateFrameRequest) returns (EvaluateFrameResponse);
  // Terminate stops debugger execution without releasing its remote resource.
  rpc Terminate(TerminateRequest) returns (TerminateResponse);
  // ReleaseDebugSession commits termination and cleanup. The session ID then becomes stale.
  rpc ReleaseDebugSession(ReleaseDebugSessionRequest) returns (ReleaseDebugSessionResponse);
  // WatchDebug always replays CREATED, RUNNING, STOPPED, or terminal state,
  // then sends ordered changes. Disconnecting a watcher never cancels debugging.
  rpc WatchDebug(WatchDebugRequest) returns (stream WatchDebugResponse);
}

message DebugSessionId {
  // value is opaque and valid only within the owning logical connection.
  string value = 1;
}

enum DebugState {
  DEBUG_STATE_UNSPECIFIED = 0;
  DEBUG_STATE_CREATED = 1;
  DEBUG_STATE_RUNNING = 2;
  DEBUG_STATE_STOPPED = 3;
  DEBUG_STATE_COMPLETED = 4;
  DEBUG_STATE_FAILED = 5;
  DEBUG_STATE_TERMINATED = 6;
}

enum DebugStopReason {
  DEBUG_STOP_REASON_UNSPECIFIED = 0;
  DEBUG_STOP_REASON_ENTRY = 1;
  DEBUG_STOP_REASON_BREAKPOINT = 2;
  DEBUG_STOP_REASON_STEP = 3;
  DEBUG_STOP_REASON_PAUSE = 4;
  DEBUG_STOP_REASON_RUNTIME_ERROR = 5;
}

enum DebugEventKind {
  DEBUG_EVENT_KIND_UNSPECIFIED = 0;
  DEBUG_EVENT_KIND_STARTED = 1;
  DEBUG_EVENT_KIND_CONTINUED = 2;
  DEBUG_EVENT_KIND_STOPPED = 3;
  DEBUG_EVENT_KIND_COMPLETED = 4;
  DEBUG_EVENT_KIND_FAILED = 5;
  DEBUG_EVENT_KIND_TERMINATED = 6;
  // CREATED is numbered after the original event set to preserve existing meanings.
  DEBUG_EVENT_KIND_CREATED = 7;
}

enum BreakpointBindingMode {
  reserved "BREAKPOINT_BINDING_MODE_NEXT_EXECUTABLE_IN_FILE";

  BREAKPOINT_BINDING_MODE_UNSPECIFIED = 0;
  BREAKPOINT_BINDING_MODE_NEXT_EXECUTABLE_IN_SOURCE = 1;
  BREAKPOINT_BINDING_MODE_EXACT = 2;
  BREAKPOINT_BINDING_MODE_NEXT_EXECUTABLE_IN_FUNCTION = 3;
}

message DebugSession {
  reserved 2, 5;
  reserved "plan_id";

  DebugSessionId id = 1;
  // state is the debug-session lifecycle discriminator.
  DebugState state = 3;
  // stop_reason is meaningful only while state is STOPPED.
  DebugStopReason stop_reason = 4;
  // hit_breakpoint_ids is populated only for a breakpoint stop.
  repeated uint64 hit_breakpoint_ids = 6;
  // output is present only for COMPLETED sessions.
  Output output = 7;
  // failure is present for failed sessions and may accompany a runtime-error stop.
  Failure failure = 8;
  // location and depth describe the current stopped state.
  Range location = 9;
  int64 depth = 10;
}

message Breakpoint {
  reserved 2, 3, 4, 5, 6, 7;
  reserved "file", "requested_line", "requested_column", "line", "column", "verified";

  // id is positive and owned by this debugger session.
  uint64 id = 1;
  // requested_location is always present; location is present only when bound.
  Location requested_location = 8;
  Range location = 9;
  uint64 point_id = 10;
  uint64 function_id = 11;
  BreakpointBindingMode binding_mode = 12;
  bool bound = 13;
}

message DebugValue {
  string type = 1;
  string display = 2;
  // reference is zero for a scalar value. A positive value is expandable only
  // within this debug session's current stopped state and becomes stale on resume.
  uint64 reference = 3;
}

message Variable {
  string name = 1;
  DebugValue value = 2;
  bool mutable = 3;
  bool parameter = 4;
}

// Frame order is the zero-based index accepted by FrameLocals and EvaluateFrame.
message Frame {
  reserved 1, 3;
  reserved "index";

  string name = 2;
  uint64 function_id = 4;
  Location location = 5;
}

message CreateDebugSessionRequest {
  ConnectionId connection_id = 1;
  PlanId plan_id = 2;
  Parameters parameters = 3;
  string output_content_type = 4;
}

message CreateDebugSessionResponse {
  // session is present in CREATED state and its CREATED event is already published.
  DebugSession session = 1;
}

message StartRequest {
  ConnectionId connection_id = 1;
  DebugSessionId debug_session_id = 2;
}

message StartResponse {}

message ContinueRequest {
  reserved 1;
  reserved "command";

  ConnectionId connection_id = 2;
  DebugSessionId debug_session_id = 3;
}

message ContinueResponse {
  reserved 1;
  reserved "session";
}

message PauseRequest {
  reserved 1;
  reserved "command";

  ConnectionId connection_id = 2;
  DebugSessionId debug_session_id = 3;
}

message PauseResponse {
  reserved 1;
  reserved "session";
}

message StepOverRequest {
  reserved 1;
  reserved "command";

  ConnectionId connection_id = 2;
  DebugSessionId debug_session_id = 3;
}

message StepOverResponse {
  reserved 1;
  reserved "session";
}

message StepInRequest {
  reserved 1;
  reserved "command";

  ConnectionId connection_id = 2;
  DebugSessionId debug_session_id = 3;
}

message StepInResponse {
  reserved 1;
  reserved "session";
}

message StepOutRequest {
  reserved 1;
  reserved "command";

  ConnectionId connection_id = 2;
  DebugSessionId debug_session_id = 3;
}

message StepOutResponse {
  reserved 1;
  reserved "session";
}

message TerminateRequest {
  ConnectionId connection_id = 1;
  DebugSessionId debug_session_id = 2;
}

message TerminateResponse {}

message BreakpointOptions {
  // Unspecified requests the Unified API default binding behavior.
  BreakpointBindingMode binding_mode = 1;
}

message SetBreakpointRequest {
  reserved 3;

  ConnectionId connection_id = 1;
  DebugSessionId debug_session_id = 2;
  Location location = 4;
  BreakpointOptions options = 5;
}

message SetBreakpointResponse {
  Breakpoint breakpoint = 1;
}

message DeleteBreakpointRequest {
  ConnectionId connection_id = 1;
  DebugSessionId debug_session_id = 2;
  uint64 breakpoint_id = 3;
}

message DeleteBreakpointResponse {}

message FramesRequest {
  ConnectionId connection_id = 1;
  DebugSessionId debug_session_id = 2;
}

message FramesResponse {
  repeated Frame frames = 1;
}

message FrameLocalsRequest {
  ConnectionId connection_id = 1;
  DebugSessionId debug_session_id = 2;
  int32 frame_index = 3;
}

message FrameLocalsResponse {
  repeated Variable variables = 1;
}

message VariablesRequest {
  ConnectionId connection_id = 1;
  DebugSessionId debug_session_id = 2;
  // reference is positive and valid only in the current stopped state.
  uint64 reference = 3;
}

message VariablesResponse {
  repeated Variable variables = 1;
}

message EvaluateFrameRequest {
  ConnectionId connection_id = 1;
  DebugSessionId debug_session_id = 2;
  int32 frame_index = 3;
  string expression = 4;
}

message EvaluateFrameResponse {
  DebugValue value = 1;
}

message ReleaseDebugSessionRequest {
  ConnectionId connection_id = 1;
  DebugSessionId debug_session_id = 2;
}

message ReleaseDebugSessionResponse {}

message WatchDebugResponse {
  reserved 1, 3, 4, 5, 6, 7, 8, 9;
  reserved "debug_session_id", "output", "started", "continued", "stopped", "completed", "failed", "terminated";

  // sequence is positive and monotonic within one DebugSession event history.
  uint64 sequence = 2;
  // kind distinguishes CREATED and the two transitions that produce RUNNING snapshots.
  DebugEventKind kind = 10;
  // session is the latest complete snapshot, including for replayed terminal state.
  DebugSession session = 11;
}

message WatchDebugRequest {
  // Both IDs address a non-owning subscription; cancelling it does not terminate the session.
  ConnectionId connection_id = 1;
  DebugSessionId debug_session_id = 2;
}
