syntax = "proto3";

package ferret.wire.v1;

import "ferret/wire/v1/source.proto";

option go_package = "github.com/MontFerret/wire/gen/ferret/wire/v1;wirev1";

// ConnectionId is an opaque, server-issued logical connection identifier.
message ConnectionId {
  // value is opaque, non-empty, and scoped to the server that issued it.
  string value = 1;
}

// ProtocolInfo identifies the versioned Wire transport contract.
message ProtocolInfo {
  // name identifies the Wire protocol independently of the hosted runtime.
  string name = 1;
  // version identifies the protobuf contract version.
  string version = 2;
}

// RuntimeIdentity is optional host-supplied identity for the hosted runtime implementation.
message RuntimeIdentity {
  // name is required whenever RuntimeIdentity is present.
  string name = 1;
  // version is optional and defined by the host.
  string version = 2;
  // instance_id optionally distinguishes one hosted runtime instance.
  string instance_id = 3;
}

// ConnectResponse is sent exactly once; the stream then remains open as the connection lifetime signal.
message ConnectResponse {
  reserved 1, 2;
  reserved "opened", "closing";

  ConnectionId connection_id = 3;
  ProtocolInfo protocol = 4;
  RuntimeIdentity runtime_identity = 5;
  // runtime_version projects api.Runtime.Version verbatim, independently of host identity.
  // Bytes preserve opaque values without requiring valid UTF-8.
  // Presence is required by alpha.20 peers; an empty but present value is valid.
  optional bytes runtime_version = 6;
  // output_framing_version must equal the requested, supported version (currently 1).
  uint32 output_framing_version = 7;
}

// ConnectRequest has no transport- or client-identity fields.
message ConnectRequest {
  reserved 1;
  reserved "client_identity";

  // Version 1 is required; incompatible peers fail before allocating a connection.
  uint32 output_framing_version = 2;
}

message CloseConnectionRequest {
  ConnectionId connection_id = 1;
}

message CloseConnectionResponse {}

enum ErrorCategory {
  ERROR_CATEGORY_UNSPECIFIED = 0;

  reserved 1, 9, 12, 13, 14;
  reserved "ERROR_CATEGORY_INVALID_REQUEST", "ERROR_CATEGORY_UNSUPPORTED_CAPABILITY", "ERROR_CATEGORY_CANCELLED", "ERROR_CATEGORY_VALUE_REFERENCE_NOT_FOUND", "ERROR_CATEGORY_RESOURCE_EXHAUSTED";

  ERROR_CATEGORY_COMPILATION_FAILURE = 2;
  ERROR_CATEGORY_EXECUTION_FAILURE = 3;
  ERROR_CATEGORY_PLAN_NOT_FOUND = 4;
  ERROR_CATEGORY_EXECUTION_NOT_FOUND = 5;
  ERROR_CATEGORY_DEBUG_SESSION_NOT_FOUND = 6;
  ERROR_CATEGORY_CONNECTION_NOT_FOUND = 7;
  ERROR_CATEGORY_INVALID_STATE = 8;
  ERROR_CATEGORY_INTERNAL_RUNTIME_FAILURE = 10;
  ERROR_CATEGORY_WATCHER_LAGGED = 11;
  ERROR_CATEGORY_BREAKPOINT_NOT_FOUND = 15;
  ERROR_CATEGORY_SESSION_NOT_FOUND = 16;
}

// ErrorDetail adds the Wire category that cannot be recovered from a gRPC code.
message ErrorDetail {
  reserved 2, 3, 4, 5;
  reserved "message", "resource", "resource_id", "diagnostics";

  ErrorCategory category = 1;
}

// DiagnosticAnnotation preserves one ordered source range reported by the Unified API.
message DiagnosticAnnotation {
  Range range = 1;
  // message may be empty when the range needs no separate label.
  string message = 2;
  // primary distinguishes the principal range from related ranges.
  bool primary = 3;
}

// Diagnostic is the portable Unified API diagnostic contract.
message Diagnostic {
  reserved 5, 6;
  reserved "source_identity", "spans";

  // kind is an open producer-defined category, not a closed Wire enum.
  string kind = 1;
  string message = 2;
  string hint = 3;
  string note = 4;
  // source preserves the complete semantic source name and content reported by the runtime.
  Source source = 7;
  // annotations preserve the producer's order and primary markers.
  repeated DiagnosticAnnotation annotations = 8;
}

// DiagnosticSet transports one ordered diagnostics.Diagnostics collection.
// Unary failures attach it as a separate gRPC status detail beside ErrorDetail;
// Wire never reconstructs it by parsing an error message.
message DiagnosticSet {
  repeated Diagnostic diagnostics = 1;
}

// Output describes detached debugger content. Presence is independent of its length.
// Its bytes follow the semantic envelope as OutputFrame messages.
message Output {
  reserved "data";

  string content_type = 1 [deprecated = true];
  bytes content = 2 [deprecated = true];
  OutputMetadata metadata = 3;
}

// OutputMetadata describes the complete encoded payload, including for partial results.
message OutputMetadata {
  string content_type = 1;
  int64 length = 2;
  bool length_known = 3;
}

// OutputFrame is transport framing, never an execution or debugger event.
// Each transfer has one header, zero or more chunks, and exactly one terminal.
// No chunks means absent content; an empty chunk establishes present empty content.
message OutputFrame {
  oneof frame {
    OutputMetadata header = 1;
    bytes chunk = 2;
    OutputTerminal terminal = 3;
  }
}

// OutputTerminal commits delivery independently of the encoded representation.
// Failure and context identity can coexist with already delivered content.
message OutputTerminal {
  uint64 transferred_bytes = 1;
  Failure failure = 2;
  bool cancelled = 3;
  bool deadline_exceeded = 4;
}

// Failure is a sanitized asynchronous runtime failure.
message Failure {
  reserved 3;
  reserved "diagnostics";

  ErrorCategory category = 1;
  // message is sanitized and never contains an arbitrary runtime error string.
  string message = 2;
  // diagnostic_set is present only when the runtime returned portable Unified API diagnostics.
  DiagnosticSet diagnostic_set = 4;
}
