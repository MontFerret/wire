syntax = "proto3";

package ferret.wire.v1;

import "ferret/wire/v1/plan.proto";
import "ferret/wire/v1/runtime.proto";
import "ferret/wire/v1/value.proto";

option go_package = "github.com/MontFerret/wire/gen/ferret/wire/v1;wirev1";

service ExecutionService {
  // Execute publishes an asynchronous execution of an existing reusable plan.
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
  rpc CancelExecution(CancelExecutionRequest) returns (CancelExecutionResponse);
  // ReleaseExecution commits cancellation and cleanup. The execution ID then becomes stale.
  rpc ReleaseExecution(ReleaseExecutionRequest) returns (ReleaseExecutionResponse);
  // WatchExecution sends the latest snapshot, then ordered changes through one terminal snapshot.
  rpc WatchExecution(WatchExecutionRequest) returns (stream WatchExecutionResponse);
}

message ExecutionId {
  string value = 1;
}

enum ExecutionState {
  EXECUTION_STATE_UNSPECIFIED = 0;
  EXECUTION_STATE_RUNNING = 1;
  EXECUTION_STATE_COMPLETED = 2;
  EXECUTION_STATE_FAILED = 3;
  EXECUTION_STATE_CANCELLED = 4;
}

message Execution {
  reserved 2;
  reserved "plan_id";

  ExecutionId id = 1;
  ExecutionState state = 3;
  Output output = 4;
  Failure failure = 5;
}

message WatchExecutionResponse {
  reserved 1, 3, 4, 5, 6, 7;
  reserved "execution_id", "output", "started", "completed", "failed", "cancelled";

  uint64 sequence = 2;
  Execution execution = 8;
}

message ExecuteRequest {
  ConnectionId connection_id = 1;
  PlanId plan_id = 2;
  Parameters parameters = 3;
  string output_content_type = 4;
}

message ExecuteResponse {
  Execution execution = 1;
}

message CancelExecutionRequest {
  ConnectionId connection_id = 1;
  ExecutionId execution_id = 2;
}

message CancelExecutionResponse {
  reserved 1;
  reserved "execution";
}

message ReleaseExecutionRequest {
  ConnectionId connection_id = 1;
  ExecutionId execution_id = 2;
}

message ReleaseExecutionResponse {}

message WatchExecutionRequest {
  ConnectionId connection_id = 1;
  ExecutionId execution_id = 2;
}
