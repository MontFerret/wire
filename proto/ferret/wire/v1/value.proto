syntax = "proto3";

package ferret.wire.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/MontFerret/wire/gen/ferret/wire/v1;wirev1";

// Value is the portable parameter subset supported by Wire.
message Value {
  reserved 7, 8, 9;
  reserved "none_value", "duration_nanos", "datetime_value", "regexp_value";

  oneof value {
    google.protobuf.NullValue null_value = 1;
    bool boolean_value = 2;
    sint64 integer_value = 3;
    double float_value = 4;
    string string_value = 5;
    bytes binary_value = 6;
    ArrayValue array_value = 10;
    ObjectValue object_value = 11;
  }
}

message ArrayValue {
  repeated Value values = 1;
}

message ObjectValue {
  map<string, Value> fields = 1;
}

message Parameters {
  map<string, Value> values = 1;
}
