name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache: true
      - run: make check-fmt
      - run: make check-tidy
      - run: make vet
      - run: make test
      - run: make build

  race-and-proto:
    name: Race and protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache: true
      - run: make lint
      - run: make test-race
      - run: make proto-lint
      - run: make check-generate
      # PR #5 reestablishes the unreleased v1 protocol baseline. Every later PR
      # compares its protocol against the fetched base branch.
      - if: github.event_name == 'pull_request' && github.event.pull_request.number != 5
        run: git fetch origin "+refs/heads/${{ github.base_ref }}:refs/heads/${{ github.base_ref }}"
      - if: github.event_name == 'pull_request' && github.event.pull_request.number != 5
        run: make proto-breaking BUF_BREAKING_AGAINST=".git#branch=${{ github.base_ref }}"
